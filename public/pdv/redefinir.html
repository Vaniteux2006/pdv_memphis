<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Memphis PDV — Redefinir senha</title>
  <meta name="theme-color" content="#0d1116" />
  <link rel="icon" href="/logo-memphis.webp" type="image/webp" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Sacramento&display=swap" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="theme-dark">
  <header class="site-header">
    <a class="brand" href="/"><img src="/logo-memphis.webp" alt="Memphis" class="brand-logo" /></a>
  </header>

  <div class="login-wrap">
    <div class="card login-card">
      <h1 id="titulo">Nova senha</h1>
      <p class="muted" id="sub">Escolha uma nova senha para sua conta.</p>
      <form id="form">
        <label for="senha" id="lbl-senha">Nova senha (mín. 6 caracteres)</label>
        <input id="senha" type="password" autocomplete="new-password" minlength="6" required />
        <label for="senha2" id="lbl-senha2">Confirmar nova senha</label>
        <input id="senha2" type="password" autocomplete="new-password" minlength="6" required />
        <div class="err" id="err" role="alert"></div>
        <button type="submit" id="btn-enviar" style="width:100%;margin-top:8px;">Redefinir senha</button>
      </form>
    </div>
  </div>

  <script src="/common.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get('token');
    // Mesma tela, dois contextos: quem pediu reset está TROCANDO uma senha que tem; quem
    // recebeu convite está CRIANDO a primeira. Falar em "nova senha" com quem nunca teve
    // uma confunde — e é a primeira tela que 1.400 pessoas vão ver.
    if (params.get('convite') === '1') {
      document.title = 'Memphis PDV — Bem-vindo';
      document.getElementById('titulo').textContent = 'Bem-vindo! Crie sua senha';
      document.getElementById('sub').textContent =
        'Você foi cadastrado na campanha de PDV. Escolha uma senha para acessar o sistema.';
      document.getElementById('lbl-senha').textContent = 'Sua senha (mín. 6 caracteres)';
      document.getElementById('lbl-senha2').textContent = 'Confirme sua senha';
      document.getElementById('btn-enviar').textContent = 'Criar senha e entrar';
    }
    if (!token) {
      document.getElementById('err').textContent = 'Link inválido. Peça um novo na tela de login.';
      document.getElementById('form').classList.add('hidden');
    }
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('err');
      err.textContent = '';
      const s1 = document.getElementById('senha').value, s2 = document.getElementById('senha2').value;
      if (s1 !== s2) { err.textContent = 'As senhas não conferem.'; return; }
      try {
        const res = await fetch('/api/reset-password', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password: s1 }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) { err.textContent = data.error || 'Não foi possível redefinir.'; return; }
        toast('Senha redefinida! Entrando...', 'ok');
        setTimeout(() => (location.href = '/pdv/login.html'), 1500);
      } catch {
        err.textContent = 'Erro de conexão. Tente de novo.';
      }
    });
  </script>
</body>
</html>
