<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Memphis PDV — Trocar senha</title>
  <meta name="theme-color" content="#1c9cc0" />
  <link rel="icon" href="/logo-memphis.webp" type="image/webp" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Sacramento&display=swap" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/"><img src="/logo-memphis.webp" alt="Memphis" class="brand-logo" /></a>
    <button class="ghost" onclick="logout()" style="font-size:13px;">Sair</button>
  </header>

  <div class="login-wrap">
    <div class="card login-card">
      <h1 id="titulo">Criar sua senha</h1>
      <p class="muted" id="subtitulo">Primeiro acesso: troque a senha provisória por uma só sua.</p>
      <form id="form">
        <div id="bloco-atual">
          <label for="atual">Senha provisória (a que você recebeu)</label>
          <input id="atual" type="password" autocomplete="current-password" required />
        </div>
        <label for="nova">Nova senha (mín. 6 caracteres)</label>
        <input id="nova" type="password" autocomplete="new-password" minlength="6" required />
        <label for="nova2">Confirmar nova senha</label>
        <input id="nova2" type="password" autocomplete="new-password" minlength="6" required />
        <div class="err" id="err" role="alert"></div>
        <button type="submit" style="width:100%;margin-top:8px;">Salvar e entrar</button>
      </form>
    </div>
  </div>

  <script src="/common.js"></script>
  <script>
    let role = 'promotor', precisaAceitar = false;
    // depois de criar a senha vem o aceite da política — os dois passos do primeiro acesso
    const proximaTela = () => precisaAceitar ? '/pdv/aceitar-politica.html'
      : (role === 'admin' ? '/pdv/admin.html' : '/pdv/promotor.html');
    // ?primeiro=1: conta criada com senha "0" — boas-vindas, sem pedir a provisória
    const primeiro = new URLSearchParams(location.search).get('primeiro') === '1';
    if (primeiro) {
      document.getElementById('titulo').textContent = 'Bem-vindo(a)! 👋';
      document.getElementById('subtitulo').textContent = 'Sua conta foi criada — agora é só escolher a sua senha pra começar a usar.';
      document.getElementById('bloco-atual').style.display = 'none';
      document.getElementById('atual').required = false;
    }
    (async () => {
      try {
        const me = await fetch('/api/me');
        if (!me.ok) { location.href = '/pdv/login.html'; return; }
        const u = await me.json();
        role = u.role;
        precisaAceitar = !!u.precisaAceitar;
        // se já trocou, não precisa ficar aqui
        if (!u.mustChangePassword) location.href = proximaTela();
      } catch { location.href = '/pdv/login.html'; }
    })();

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('err'); err.textContent = '';
      const a = primeiro ? '0' : document.getElementById('atual').value;
      const n = document.getElementById('nova').value, n2 = document.getElementById('nova2').value;
      if (n !== n2) { err.textContent = 'As senhas não conferem.'; return; }
      if (!primeiro && n === a) { err.textContent = 'A nova senha precisa ser diferente da provisória.'; return; }
      try {
        await api('/api/change-password', { method: 'POST', body: JSON.stringify({ currentPassword: a, newPassword: n }) });
        toast('Senha criada! Entrando...', 'ok');
        setTimeout(() => (location.href = proximaTela()), 1200);
      } catch (ex) { err.textContent = ex.message; }
    });
  </script>
</body>
</html>
